<div class="min-h-screen bg-gray-50 dark:bg-gray-950 xl:flex">

  <!-- Sidebar (fixed, z-40) -->
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>

  <!-- Main column -->
  <div
    class="flex min-h-screen w-full flex-col transition-all duration-300 ease-in-out"
    [ngClass]="{
      'xl:ml-[290px] xl:w-[calc(100%-290px)]': (isExpanded$ | async) || (isHovered$ | async),
      'xl:ml-[90px]  xl:w-[calc(100%-90px)]':  !((isExpanded$ | async) || (isHovered$ | async))
    }">

    <!-- Header (sticky, z-50 — sits above sidebar on mobile) -->
    <app-header class="block w-full"/>

    <!-- Page content -->
    <main class="flex-1 p-4 md:p-6">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
