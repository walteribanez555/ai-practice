name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

env:
  AWS_DEFAULT_REGION: us-east-1
  NODE_VERSION: "24"
  ENVIRONMENT: prod
  STACK_NAME: AssistanceStack-Prod

# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ─── 1. Detect changes ──────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      infra:         ${{ steps.filter.outputs.infra }}
      infra_drift:   ${{ steps.drift.outputs.drift }}
      process_claim: ${{ steps.filter.outputs.process_claim }}
      claims_api:    ${{ steps.filter.outputs.claims_api }}
      dashboard:     ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            infra:
              - 'infra/**'
            process_claim:
              - 'apps/process-claim-document/**'
            claims_api:
              - 'apps/claims-api-handler/**'
            dashboard:
              - 'apps/dashboard/**'

      - name: Install infra deps (drift check)
        if: github.event_name != 'pull_request'
        run: npm ci
        working-directory: infra

      - uses: aws-actions/configure-aws-credentials@v4
        if: github.event_name != 'pull_request'
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: CDK drift check
        id: drift
        if: github.event_name != 'pull_request'
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null \
            || echo "DOES_NOT_EXIST")

          if [[ "$STATUS" == "DOES_NOT_EXIST" ]]; then
            echo "Stack not found — first deploy."
            echo "drift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIFF=$(cd infra && npx cdk diff ${{ env.STACK_NAME }} \
            -c environment=${{ env.ENVIRONMENT }} 2>&1 || true)

          if echo "$DIFF" | grep -qE '\[\+\]|\[-\]|\[~\]'; then
            echo "drift=true"  >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set drift=false (PR)
        if: github.event_name == 'pull_request'
        run: echo "drift=false" >> "$GITHUB_OUTPUT"

  # ─── 2. Validate — PRs only ─────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      - name: Type-check process-claim-document
        run: npx tsc --noEmit
        working-directory: apps/process-claim-document

      - name: Type-check claims-api-handler
        run: npx tsc --noEmit
        working-directory: apps/claims-api-handler

      - name: Install infra deps
        run: npm ci
        working-directory: infra

      - name: Type-check infra
        run: npx tsc --noEmit
        working-directory: infra

  # ─── 3. Deploy infrastructure ───────────────────────────────────────────────
  deploy-infra:
    name: Deploy infra
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name != 'pull_request' && (
        needs.changes.outputs.infra      == 'true' ||
        needs.changes.outputs.infra_drift == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      - name: Install infra deps
        run: npm ci
        working-directory: infra

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Ensure shared stack is deployed
        working-directory: infra
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name AssistanceSharedStack \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null \
            || echo "DOES_NOT_EXIST")

          if [[ "$STATUS" == "DOES_NOT_EXIST" ]]; then
            echo "Shared stack missing — deploying..."
            npx cdk deploy AssistanceSharedStack --require-approval never
          elif [[ "$STATUS" == *ROLLBACK* || "$STATUS" == *FAILED* ]]; then
            echo "❌ Shared stack in '$STATUS' — manual intervention required."
            exit 1
          else
            echo "✅ Shared stack exists ($STATUS)."
          fi

      - name: CDK deploy
        working-directory: infra
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          npx cdk deploy ${{ env.STACK_NAME }} \
            -c environment=${{ env.ENVIRONMENT }} \
            --require-approval never

  # ─── 4. Deploy process-claim-document (internal Lambda) ─────────────────────
  deploy-process-claim:
    name: Deploy process-claim-document
    runs-on: ubuntu-latest
    needs: [changes, deploy-infra]
    if: |
      always() &&
      github.event_name != 'pull_request' && (
        needs.changes.outputs.process_claim == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Build Lambda
        run: npm run build:lambda:prod
        working-directory: apps/process-claim-document

      - name: Package artifact
        run: cd apps/process-claim-document/dist && zip ../../../deploy-process-claim.zip index.js

      - name: Report artifact size
        run: |
          SIZE_BYTES=$(stat -c%s deploy-process-claim.zip)
          SIZE_KB=$(echo "scale=2; $SIZE_BYTES / 1024" | bc)
          SIZE_MB=$(echo "scale=4; $SIZE_BYTES / 1048576" | bc)
          echo "deploy-process-claim.zip → ${SIZE_BYTES} bytes (${SIZE_KB} KB / ${SIZE_MB} MB)"

      - name: Deploy to Lambda
        run: |
          FUNCTION_NAME="assistance-prod-process-claim-document"
          RETRY_COUNT=5
          RETRY_INTERVAL=10

          for i in $(seq 1 $RETRY_COUNT); do
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file fileb://deploy-process-claim.zip && break
            if [ "$i" -eq "$RETRY_COUNT" ]; then
              echo "❌ Max retries reached."
              exit 1
            fi
            echo "Retrying in ${RETRY_INTERVAL}s... (attempt $i/$RETRY_COUNT)"
            sleep $RETRY_INTERVAL
          done

          echo "✅ Lambda updated: $FUNCTION_NAME"

  # ─── 5. Deploy claims-api-handler (external Lambda + API Gateway) ────────────
  deploy-claims-api:
    name: Deploy claims-api-handler
    runs-on: ubuntu-latest
    needs: [changes, deploy-infra]
    if: |
      always() &&
      github.event_name != 'pull_request' && (
        needs.changes.outputs.claims_api == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Build Lambda
        run: npm run build:lambda:prod
        working-directory: apps/claims-api-handler

      - name: Package artifact
        run: cd apps/claims-api-handler/dist && zip ../../../deploy-claims-api.zip index.js

      - name: Report artifact size
        run: |
          SIZE_BYTES=$(stat -c%s deploy-claims-api.zip)
          SIZE_KB=$(echo "scale=2; $SIZE_BYTES / 1024" | bc)
          SIZE_MB=$(echo "scale=4; $SIZE_BYTES / 1048576" | bc)
          echo "deploy-claims-api.zip → ${SIZE_BYTES} bytes (${SIZE_KB} KB / ${SIZE_MB} MB)"

      - name: Deploy to Lambda
        run: |
          FUNCTION_NAME="assistance-prod-claims-api-handler"
          RETRY_COUNT=5
          RETRY_INTERVAL=10

          for i in $(seq 1 $RETRY_COUNT); do
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file fileb://deploy-claims-api.zip && break
            if [ "$i" -eq "$RETRY_COUNT" ]; then
              echo "❌ Max retries reached."
              exit 1
            fi
            echo "Retrying in ${RETRY_INTERVAL}s... (attempt $i/$RETRY_COUNT)"
            sleep $RETRY_INTERVAL
          done

          echo "✅ Lambda updated: $FUNCTION_NAME"

  # ─── 6. Health check — claims-api-handler endpoint ──────────────────────────
  health:
    name: Health check
    runs-on: ubuntu-latest
    needs: deploy-claims-api
    if: always() && needs.deploy-claims-api.result == 'success'
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Get API endpoint
        id: endpoint
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ClaimsApiEndpoint`].OutputValue' \
            --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🚀 API endpoint: $URL"

      - name: Wait for Lambda cold start
        run: sleep 5

      - name: GET /api/v1/health
        run: |
          URL="${{ steps.endpoint.outputs.url }}"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/v1/health")
            echo "Attempt $i → HTTP $STATUS"
            [[ "$STATUS" == "200" ]] && echo "✅ Health endpoint healthy." && exit 0
            sleep 10
          done
          echo "❌ Health endpoint unreachable." && exit 1

  # ─── 7. Deploy dashboard (S3 + CloudFront invalidation) ────────────────────
  deploy-dashboard:
    name: Deploy dashboard
    runs-on: ubuntu-latest
    needs: [changes, deploy-infra]
    if: |
      always() &&
      github.event_name != 'pull_request' && (
        needs.changes.outputs.dashboard == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      - name: Build dashboard
        run: npm run build:prod
        working-directory: apps/dashboard

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Get S3 bucket name
        id: bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`DashboardBucketName`].OutputValue' \
            --output text)
          echo "name=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "S3 bucket: $BUCKET"

      - name: Sync to S3
        run: |
          aws s3 sync apps/dashboard/dist/dashboard/browser/ \
            s3://${{ steps.bucket.outputs.name }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable"
          # index.html must not be cached — the browser always fetches it fresh
          aws s3 cp apps/dashboard/dist/dashboard/browser/index.html \
            s3://${{ steps.bucket.outputs.name }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`DashboardDistributionId`].OutputValue' \
            --output text)

          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"

          echo "✅ CloudFront invalidated: $DIST_ID"

  # ─── 8. Tag & GitHub Release ────────────────────────────────────────────────
  tag-release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: [deploy-process-claim, deploy-claims-api, deploy-dashboard, health]
    if: |
      always() && !cancelled() && (
        needs.deploy-process-claim.result == 'success' ||
        needs.deploy-claims-api.result   == 'success' ||
        needs.deploy-dashboard.result    == 'success'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            LAST=$(git tag -l 'v*' --sort=-version:refname | head -1)
            if [[ -z "$LAST" ]]; then
              TAG="v1.0.0"
            else
              MAJOR=$(echo "$LAST" | sed 's/^v//' | cut -d. -f1)
              MINOR=$(echo "$LAST" | cut -d. -f2)
              TAG="v${MAJOR}.$((MINOR + 1)).0"
            fi
            git tag "$TAG" && git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV=$(git tag -l 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [[ -z "$PREV" ]]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -30)
          else
            LOG=$(git log "${PREV}..${TAG}" --pretty=format:"- %s (%h)" --no-merges)
          fi
          { echo "log<<EOF"; echo "$LOG"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "## Changes
          ${{ steps.changelog.outputs.log }}

          ## Services deployed
          - process-claim-document: \`assistance-prod-process-claim-document\`
          - claims-api-handler: \`assistance-prod-claims-api-handler\`

          ## Infrastructure
          - Stack: \`${{ env.STACK_NAME }}\`
          - Region: \`us-east-1\`
          - Commit: \`${{ github.sha }}\`"
